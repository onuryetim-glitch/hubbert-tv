<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hubbert – TV Ekranı</title>
<style>
:root{--bg:#1b1d1f;--bg2:#24292c;--teal:#2f6b80;--teal2:#4fa3bf;--gold:#d8bb7d;--text:#ffffff;--muted:#b9c3c9;--stage:#0e0f10;--card:rgba(255,255,255,.06);--cardb:rgba(216,187,125,.25)}
@media (prefers-color-scheme: dark){:root{--stage:#08090a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--stage);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.player{position:relative;width:min(100%,calc((100vh - 100px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,var(--bg2),var(--bg) 70%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.player:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto}
.particles{position:absolute;inset:0;pointer-events:none}
.particles i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--teal2);opacity:.0;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(20px);opacity:0}20%{opacity:.5}100%{transform:translateY(-140px);opacity:0}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3.5%;opacity:0;visibility:hidden;transition:opacity .6s ease;padding:4% 6% 10%}
.scene.active{opacity:1;visibility:visible}
.corner{position:absolute;inset-block-start:3.5%;inset-inline-start:3%;width:clamp(30px,4.5vw,56px);z-index:5;animation:cornerSpin 8s ease-in-out infinite}
@keyframes cornerSpin{0%,85%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.brand{position:absolute;inset-block-start:5%;inset-inline-start:calc(3% + clamp(38px,5.5vw,66px));font-size:clamp(10px,1.3vw,16px);font-weight:700;color:var(--gold);letter-spacing:.08em;z-index:5}
h1{font-size:clamp(34px,7vw,92px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(24px,4.4vw,58px);font-weight:800}
.sub{font-size:clamp(14px,2.2vw,30px);color:var(--muted)}
.gold{color:var(--gold)}.teal{color:var(--teal2)}

/* ---- Hubbert icon ---- */
.hub{display:grid;place-items:center;perspective:900px}
.hub .mover{width:100%;transform-origin:50% 50%}
.hub svg{width:100%;height:auto;overflow:visible;display:block}
.hub.big{width:clamp(130px,24vw,300px)}
.hub.mid{width:clamp(90px,14vw,180px)}
/* entrance variations: every one spins, small -> big */
.scene.active .hub[data-anim="spinGrow"] .mover{animation:spinGrow 2s cubic-bezier(.2,.8,.2,1) both, bob 3.2s ease-in-out 2s infinite}
.scene.active .hub[data-anim="roll"] .mover{animation:roll 2s cubic-bezier(.2,.8,.2,1) both, bob 3.2s ease-in-out 2s infinite}
.scene.active .hub[data-anim="flip"] .mover{animation:flip 2s cubic-bezier(.2,.8,.2,1) both, bob 3.2s ease-in-out 2s infinite}
.scene.active .hub[data-anim="drop"] .mover{animation:drop 2s cubic-bezier(.2,.8,.2,1) both, bob 3.2s ease-in-out 2s infinite}
.scene.active .hub[data-anim="zoomSpin"] .mover{animation:zoomSpin 2s cubic-bezier(.2,.8,.2,1) both, bob 3.2s ease-in-out 2s infinite}
@keyframes spinGrow{0%{transform:rotate(-720deg) scale(.05);opacity:0}15%{opacity:1}75%{transform:rotate(12deg) scale(1.12)}100%{transform:rotate(0) scale(1)}}
@keyframes roll{0%{transform:translateX(-55vw) rotate(-900deg) scale(.15);opacity:0}15%{opacity:1}75%{transform:translateX(2vw) rotate(10deg) scale(1.08)}100%{transform:none}}
@keyframes flip{0%{transform:rotateY(-1080deg) scale(.08);opacity:0}15%{opacity:1}80%{transform:rotateY(15deg) scale(1.1)}100%{transform:rotateY(0) scale(1)}}
@keyframes drop{0%{transform:translateY(-55vh) rotate(-540deg) scale(.15);opacity:0}15%{opacity:1}60%{transform:translateY(3vh) rotate(0) scale(1.05,.92)}78%{transform:translateY(-2vh) scale(.98,1.04)}100%{transform:none}}
@keyframes zoomSpin{0%{transform:rotate(-360deg) scale(.05);opacity:0}40%{transform:rotate(180deg) scale(.6);opacity:1}80%{transform:rotate(380deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-3deg)}75%{transform:translateY(-3px) rotate(3deg)}}
/* glow + ring */
.hub .glow{opacity:0;transform-origin:50px 50px}
.scene.active .hub .glow{animation:glow 2.6s ease-in-out 1.8s infinite}
@keyframes glow{0%,100%{opacity:.15;transform:scale(.95)}50%{opacity:.55;transform:scale(1.08)}}
.hub .ring{fill:none;stroke:var(--teal2);stroke-width:1;opacity:0;transform-origin:50px 50px}
.scene.active .hub .ring{animation:ring 2.6s ease-out 2s infinite}
@keyframes ring{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
/* bubbles draw */
.hub .b1,.hub .b2{stroke-dasharray:300;stroke-dashoffset:300}
.scene.active .hub .b1{animation:draw 1.1s ease-out .9s forwards}
.scene.active .hub .b2{animation:draw 1.1s ease-out 1.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* AI text -> face */
.hub .ai{opacity:0;transform-origin:42px 31px}
.scene.active .hub .ai{animation:aiPop .6s cubic-bezier(.3,1.6,.5,1) 1.8s forwards, aiOut .4s ease-in 3.1s forwards}
@keyframes aiPop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes aiOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3) rotate(-20deg)}}
.hub .face{opacity:0}
.scene.active .hub .face{animation:faceIn .5s cubic-bezier(.3,1.6,.5,1) 3.4s forwards}
@keyframes faceIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.hub .face{transform-origin:42px 31px}
.hub .eye{transform-box:fill-box;transform-origin:50% 50%}
.scene.active .hub .eyeL{animation:blink 3.6s ease-in-out 5.6s infinite}
.scene.active .hub .eyeR{animation:wink .7s ease-in-out 4.1s, blink 3.6s ease-in-out 5.6s infinite}
@keyframes wink{0%,100%{transform:scaleY(1)}30%,65%{transform:scaleY(.08)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.hub .smile{stroke-dasharray:40;stroke-dashoffset:40;transform-box:fill-box;transform-origin:50% 0}
.scene.active .hub .smile{animation:smileDraw .5s ease-out 3.6s forwards, grin .7s ease-in-out 4.1s}
@keyframes smileDraw{to{stroke-dashoffset:0}}
@keyframes grin{0%,100%{transform:scale(1)}40%,70%{transform:scale(1.18,1.35)}}
.hub .cheek{opacity:0}
.scene.active .hub .cheek{animation:cheek .7s ease-in-out 4.1s}
@keyframes cheek{0%,100%{opacity:0}40%,70%{opacity:.55}}
/* typing dots */
.hub .d{opacity:0}
.scene.active .hub .d{animation:typing 1.4s ease-in-out infinite}
.scene.active .hub .d1{animation-delay:2.2s}.scene.active .hub .d2{animation-delay:2.4s}.scene.active .hub .d3{animation-delay:2.6s}
@keyframes typing{0%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}

/* company logo */
.logo{position:absolute;inset-block-end:2.6%;inset-inline-end:2.4%;width:clamp(70px,12vw,170px);z-index:8;background:#fff;border-radius:8px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.logo img{display:block;width:100%;height:auto}

/* ---- content ---- */
.pop > *{opacity:0;transform:translateY(20px) scale(.9)}
.scene.active .pop > *{animation:up .6s cubic-bezier(.3,1.4,.5,1) forwards}
.scene.active .pop > *:nth-child(1){animation-delay:1.6s}
.scene.active .pop > *:nth-child(2){animation-delay:2.0s}
.scene.active .pop > *:nth-child(3){animation-delay:2.4s}
.scene.active .pop > *:nth-child(4){animation-delay:2.8s}
.scene.active .pop > *:nth-child(5){animation-delay:3.2s}
@keyframes up{to{opacity:1;transform:none}}
.fade{opacity:0}
.scene.active .fade{animation:up .6s ease forwards;animation-delay:1.3s}
.scene.active .fade.l2{animation-delay:1.7s}
.tiles{display:flex;gap:clamp(10px,2.4vw,34px);justify-content:center;flex-wrap:wrap}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:clamp(80px,13vw,170px)}
.tile .ic{width:clamp(56px,8.5vw,110px);aspect-ratio:1;border-radius:24%;display:grid;place-items:center;font-size:clamp(26px,4.2vw,54px);background:var(--card);border:1px solid var(--cardb)}
.tile b{font-size:clamp(13px,1.8vw,24px)}
.flow{display:flex;align-items:center;gap:clamp(6px,1.6vw,22px)}
.flow .arrow{color:var(--gold);font-size:clamp(18px,3vw,40px);opacity:.8}
.cta{display:inline-block;padding:.45em 1.2em;border-radius:999px;background:var(--gold);color:#1b1d1f;font-weight:800;font-size:clamp(18px,3vw,40px)}
.caption{position:absolute;inset-inline:0;inset-block-end:0;padding:1.4% 17% 2.2%;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:clamp(11px,1.5vw,20px);color:#fff;text-align:center;z-index:6}
.bar{position:absolute;inset-inline-start:0;inset-block-end:0;height:4px;background:var(--gold);width:0;z-index:7}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{background:#24292c;color:#fff;border:1px solid #3a4246;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.controls button:hover{background:#2f6b80}
.hint{font-size:12px;color:#8a949a;text-align:center}

.scene.active .pop > *:nth-child(6){animation-delay:3.6s}
.scene.active .pop > *:nth-child(7){animation-delay:4.0s}
.scene.active .pop > *:nth-child(8){animation-delay:4.4s}
body.tv{padding:0;gap:0;cursor:none}
body.tv .player{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto}
body.tv .controls, body.tv .hint{display:none}
.sync{position:absolute;inset-block-start:4%;inset-inline-end:3%;font-size:clamp(9px,1vw,13px);color:#8a949a;z-index:5;opacity:.0;transition:opacity .4s}
.sync.show{opacity:.9}

/* ===== Doğum günü sahnesi (açık renk) ===== */
.player .brand,.player .caption{transition:color .6s,background .6s}
.player.light .brand{color:#9a7b3c}
.player.light .caption{background:linear-gradient(transparent,rgba(255,255,255,.94));color:#2b3338}
.bday{--u:min(1vh,.5625vw);padding:3% 6% 9%}
.bday .bbg{position:absolute;inset:0;z-index:0;background:
  repeating-conic-gradient(from 0deg at 50% 34%,rgba(216,187,125,.11) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg),
  radial-gradient(circle at 50% 34%,#ffffff 0%,#fdf9f1 45%,#f3e8d2 100%)}
.bday .fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bday .fx .cf{position:absolute;top:-6%;width:calc(var(--u)*1.1);height:calc(var(--u)*1.8);border-radius:2px;opacity:.9;animation:bdFall linear infinite}
@keyframes bdFall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(115vh) rotate(760deg)}}
.bday .fx .bl{position:absolute;bottom:-30%;width:calc(var(--u)*6);aspect-ratio:.82;border-radius:50% 50% 47% 47%;opacity:.75;animation:bdRise linear infinite}
.bday .fx .bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70%;background:rgba(120,100,60,.35)}
@keyframes bdRise{0%{transform:translate(0,0)}50%{transform:translate(18px,-70vh)}100%{transform:translate(-12px,-145vh)}}
.bwrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.5);text-align:center}
.bframe{position:relative;width:calc(var(--u)*37);aspect-ratio:1;opacity:0;margin-block-end:calc(var(--u)*1)}
.scene.active .bframe{animation:bfIn 1.2s cubic-bezier(.3,1.4,.5,1) .3s forwards}
@keyframes bfIn{0%{opacity:0;transform:scale(.2) rotate(-160deg)}100%{opacity:1;transform:none}}
.bframe .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#b8913f,#f6e3b4,#c9a45c,#fff6df,#a8822f,#f0d9a2,#b8913f);
  animation:bdSpin 8s linear infinite;box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(140,105,40,.35)}
.bframe .dots{position:absolute;inset:calc(var(--u)*-2);border-radius:50%;border:2px dashed rgba(201,164,92,.7);animation:bdSpin 40s linear infinite reverse}
.bframe .ph{position:absolute;inset:calc(var(--u)*1.2);border-radius:50%;overflow:hidden;background:#f7f1e6;border:calc(var(--u)*.7) solid #fff;
  display:grid;place-items:center;font-size:calc(var(--u)*11);font-weight:800;color:#c9a45c}
.bframe .ph img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes bdSpin{to{transform:rotate(360deg)}}
.bframe .sp{position:absolute;color:#d1ab5c;font-size:calc(var(--u)*3.2);animation:bdTw 2.4s ease-in-out infinite}
@keyframes bdTw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.bframe .bhub{position:absolute;width:30%;inset-block-start:-6%;inset-inline-start:-16%;z-index:3}
.bframe .bhub .hub{width:100%}
.bframe .bhub .mover{position:relative}
.bframe .hat{position:absolute;width:46%;inset-block-start:-32%;inset-inline-start:44%;transform:rotate(22deg);z-index:3}
.bframe .hat svg{width:100%;height:auto;display:block}
.bribbon,.bname,.btitle,.bmsg,.bzod{opacity:0;transform:translateY(18px)}
.scene.active .bribbon{animation:up .6s ease 1s forwards}
.scene.active .bname{animation:up .7s cubic-bezier(.3,1.5,.5,1) 1.25s forwards}
.scene.active .btitle{animation:up .6s ease 1.5s forwards}
.scene.active .bmsg{animation:up .6s ease 1.75s forwards}
.scene.active .bzod{animation:up .6s ease 2s forwards}
.bribbon{padding:.35em 1.3em;border-radius:999px;background:linear-gradient(90deg,#c9a45c,#ecd6a0,#c9a45c);color:#3b2f17;font-weight:800;
  letter-spacing:.14em;font-size:calc(var(--u)*2.4);box-shadow:0 4px 14px rgba(150,115,45,.3)}
.bname{font-size:calc(var(--u)*7.2);font-weight:800;color:#1d2b36;line-height:1.05}
.btitle{font-size:calc(var(--u)*2.6);color:#5b6770}
.bmsg{font-size:calc(var(--u)*3.4);color:#2f6b80;font-weight:700}
.bzod{display:inline-flex;align-items:center;gap:.5em;padding:.35em 1.1em;border-radius:999px;background:#f6ecd6;border:1px solid #e3cf9f;color:#7a5b22;
  font-size:calc(var(--u)*2.4);font-weight:600}
.bzod .sym{font-size:1.45em;line-height:1;font-family:"Segoe UI Symbol","Noto Sans Symbols","DejaVu Sans",sans-serif}

/* ===== Hava durumu ===== */
.wx{position:absolute;inset-block-start:3%;inset-inline-end:2.4%;z-index:5;display:none;align-items:center;gap:clamp(6px,.8vw,12px);
  padding:clamp(3px,.4vw,7px) clamp(10px,1.3vw,20px) clamp(3px,.4vw,7px) clamp(5px,.6vw,10px);border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(216,187,125,.3);color:#fff;transition:opacity .5s,background .6s,color .6s,border-color .6s}
.wx.on{display:flex}
.wx .wx-ic{width:clamp(30px,3.6vw,52px);height:clamp(30px,3.6vw,52px)}
.wx .wx-t{font-size:clamp(17px,2.4vw,36px);font-weight:800;line-height:1}
.wx .wx-l{display:flex;flex-direction:column;line-height:1.2;text-align:start}
.wx .wx-c{font-size:clamp(9px,.95vw,14px);font-weight:700;color:var(--gold)}
.wx .wx-d{font-size:clamp(9px,.95vw,14px);color:var(--muted)}
.wx .wx-d em{font-style:normal;opacity:.6}
.player.light .wx{background:rgba(255,255,255,.9);color:#1d2b36;border-color:#e3cf9f}
.player.light .wx .wx-c{color:#9a7b3c}
.player.light .wx .wx-d{color:#5b6770}
.player.light .wx svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
.player.wx-scene .wx{opacity:0}
.player.wx-on .sync{inset-block-start:calc(3% + clamp(42px,5vw,74px))}
.wx-ic svg,.wx-big svg{width:100%;height:100%;display:block;overflow:visible}
.wx-rays{transform-box:fill-box;transform-origin:center;animation:wxSpin 16s linear infinite}
@keyframes wxSpin{to{transform:rotate(360deg)}}
.wx-cloud{animation:wxDrift 5s ease-in-out infinite alternate}
@keyframes wxDrift{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
.wx-drop{animation:wxDrop 1.1s linear infinite}
.wx-drop.d2{animation-delay:.35s}.wx-drop.d3{animation-delay:.7s}
@keyframes wxDrop{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.wx-flake{animation:wxSnow 2.2s linear infinite}
.wx-flake.d2{animation-delay:.7s}.wx-flake.d3{animation-delay:1.4s}
@keyframes wxSnow{0%{transform:translate(0,-4px);opacity:0}30%{opacity:1}100%{transform:translate(2px,8px);opacity:0}}
.wx-bolt{animation:wxFlash 2.6s ease-in-out infinite}
@keyframes wxFlash{0%,62%,100%{opacity:1}66%,74%{opacity:.15}70%{opacity:1}}
.wx-fog{animation:wxFog 4s ease-in-out infinite}
.wx-fog.f2{animation-delay:-2s}
@keyframes wxFog{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.wx-star{animation:wxTw 2.4s ease-in-out infinite}
.wx-star.s2{animation-delay:1.2s}
@keyframes wxTw{0%,100%{opacity:.25}50%{opacity:1}}
.wxs{--u:min(1vh,.5625vw);gap:calc(var(--u)*2.2)}
.wxs .hub.mid{width:calc(var(--u)*13)}
.wxs .wx-head h2{font-size:calc(var(--u)*6);line-height:1.1;margin:0}
.wxs .wx-head .sub{font-size:calc(var(--u)*2.8);color:var(--gold)}
.wxs .wx-main{display:flex;align-items:center;gap:calc(var(--u)*3.5)}
.wxs .wx-big{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.wxs .wx-temp{font-size:calc(var(--u)*15);font-weight:800;line-height:1}
.wxs .wx-col{text-align:start;display:flex;flex-direction:column;gap:calc(var(--u)*.8)}
.wxs .wx-desc{font-size:calc(var(--u)*4);font-weight:700;color:var(--gold)}
.wxs .wx-meta{font-size:calc(var(--u)*2.5);color:var(--muted)}
.wxs .wx-days{display:flex;gap:calc(var(--u)*2.2)}
.wxs .wx-day{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);min-width:calc(var(--u)*17);
  padding:calc(var(--u)*1.4) calc(var(--u)*2);border-radius:14px;background:var(--card);border:1px solid var(--cardb)}
.wxs .wx-day b{font-size:calc(var(--u)*2.3)}
.wxs .wx-day .wx-ic{width:calc(var(--u)*7);height:calc(var(--u)*7)}
.wxs .wx-day span{font-size:calc(var(--u)*2.4);font-weight:700}
.wxs .wx-day small{font-size:calc(var(--u)*1.9);color:var(--teal2)}
.wxs .wx-src{position:absolute;inset-block-end:11%;inset-inline-end:3%;font-size:calc(var(--u)*1.5);color:#7c878e}
.wxs .wx-head,.wxs .wx-main,.wxs .wx-days{opacity:0;transform:translateY(18px)}
.scene.active .wx-head{animation:up .6s ease 1.1s forwards}
.scene.active .wx-main{animation:up .7s cubic-bezier(.3,1.4,.5,1) 1.5s forwards}
.scene.active .wx-days{animation:up .6s ease 2s forwards}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="particles" id="particles"></div>
  <div class="corner" id="corner"></div>
  <div class="brand" id="brand">HUBBERT</div>
  <div class="sync" id="sync">● Güncellendi</div>
  <div class="wx" id="wx"></div>
  <div id="stage"></div>
  <div class="logo" id="logo"><img alt="Atlas Copco Group" id="logoImg"></div>
  <div class="caption" id="caption"></div>
  <div class="bar" id="bar"></div>
</div>
<div class="controls">
  <button type="button" id="prev">⏮ Geri</button>
  <button type="button" id="play">⏸ Duraklat</button>
  <button type="button" id="next">İleri ⏭</button>
  <button type="button" id="restart">↺ Baştan</button>
  <button type="button" id="full">⛶ Tam ekran</button>
</div>
<div class="hint">Boşluk = oynat/duraklat · ← → = sahne · F = tam ekran · TV modu için adrese ?tv=1 ekleyin</div>
<script>
(function(){
  var ICON='<div class="mover"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+
   '<circle class="ring" cx="50" cy="50" r="46"/>'+

    else if(k==='fog'){s=up+wxCloud('#dfe6ea')+'</g><g stroke="#b9c3c9" stroke-width="3.4" stroke-linecap="round"><line class="wx-fog" x1="14" y1="50" x2="50" y2="50"/><line class="wx-fog f2" x1="20" y1="57" x2="56" y2="57"/></g>';}
    else if(k==='drizzle'){s=up+wxCloud('#eef3f6')+'</g><g fill="#4fa3bf"><circle class="wx-drop" cx="24" cy="50" r="2"/><circle class="wx-drop d2" cx="34" cy="53" r="2"/><circle class="wx-drop d3" cx="44" cy="50" r="2"/></g>';}
    else if(k==='rain'){s=up+wxCloud('#eef3f6')+'</g><g stroke="#4fa3bf" stroke-width="3.2" stroke-linecap="round"><line class="wx-drop" x1="24" y1="47" x2="21" y2="55"/><line class="wx-drop d2" x1="34" y1="49" x2="31" y2="57"/><line class="wx-drop d3" x1="44" y1="47" x2="41" y2="55"/></g>';}
    else if(k==='snow'){s=up+wxCloud('#eef3f6')+'</g><g fill="#ffffff" stroke="#9fb0ba" stroke-width=".8"><circle class="wx-flake" cx="24" cy="50" r="2.6"/><circle class="wx-flake d2" cx="34" cy="54" r="2.6"/><circle class="wx-flake d3" cx="44" cy="50" r="2.6"/></g>';}
    else {s=up+wxCloud('#9aa7b0')+'</g><polygon class="wx-bolt" points="35,40 26,53 33,53 29,62 42,48 35,48 39,40" fill="#f5c451"/>';}
    return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+s+'</svg>';
  }
  function wxCfg(c){return (c&&c.weather)||{};}
  function wxFresh(){return !!wxData&&(Date.now()-wxData.at)<3*3600*1000;}
  function wxTip(cur,inf){var k=inf[1],t=cur.temperature_2m;
    if(k==='storm'){return 'Fırtınaya dikkat, güvenli kalın! ⛈️';}
    if(k==='rain'||k==='drizzle'){return 'Şemsiyenizi almayı unutmayın! ☂️';}
    if(k==='snow'){return 'Yollar kaygan olabilir, dikkatli olun! ❄️';}
    if(k==='fog'){return 'Sisli havada trafikte dikkatli olun! 🌫️';}
    if(t>=30){return 'Bol su için, serin kalın! ☀️';}
    if(t<=5){return 'Sıkı giyinin! 🧣';}
    return 'İyi çalışmalar! 😊';}
  function fetchWeather(){
    if(!wxKey){return;}
    var key=wxKey,p=key.split(',');
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+p[0]+'&longitude='+p[1]+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4',{cache:'no-store'})
      .then(function(r){if(!r.ok){throw new Error(r.status);}return r.json();})
      .then(function(j){
        if(key!==wxKey||!j||!j.current){return;}
        var had=wxFresh();wxData={at:Date.now(),cur:j.current,daily:j.daily||{}};renderWx();
        if(lastOpts.forceWeather){build(content,lastOpts);show(0);return;}
        if(wxCfg(content).scene&&!had&&!scenes.some(function(s){return s._wx;})){wxRebuild=true;}
      })
      .catch(function(){if(key!==wxKey){return;}if(wxData&&!wxFresh()){wxData=null;renderWx();wxRebuild=true;}if(!wxFresh()){setTimeout(function(){if(key===wxKey&&!wxFresh()){fetchWeather();}},120000);}});
  }
  function ensureWeather(c,force){
    var w=wxCfg(c),ok=(w.widget||w.scene||force)&&w.lat!==''&&w.lon!==''&&w.lat!=null&&w.lon!=null&&isFinite(+w.lat)&&isFinite(+w.lon);
    var key=ok?(+w.lat).toFixed(3)+','+(+w.lon).toFixed(3):'';
    if(key!==wxKey){wxKey=key;wxData=null;fetchWeather();}
    if(!wxTimer){wxTimer=setInterval(fetchWeather,15*60*1000);}
    renderWx();
  }
  function renderWx(){
    var w=wxCfg(content),vis=!!(w.widget&&wxFresh());
    wxEl.classList.toggle('on',vis);player.classList.toggle('wx-on',vis);
    if(!vis){return;}
    var cur=wxData.cur,inf=wxInfo(cur.weather_code);
    wxEl.innerHTML='';
    var ic=el('div','wx-ic');ic.innerHTML=wxIcon(cur.weather_code,cur.is_day);wxEl.appendChild(ic);
    wxEl.appendChild(el('div','wx-t',Math.round(cur.temperature_2m)+'°'));
    var l=el('div','wx-l');l.appendChild(el('span','wx-c',w.name||''));
    var d=el('span','wx-d',inf[0]+' ');d.appendChild(el('em',null,'· Open-Meteo'));l.appendChild(d);wxEl.appendChild(l);
  }
  function weatherScene(c){
    var w=wxCfg(c),sec=el('section','scene wxs');sec._wx=true;sec._d=Math.max(5,+w.duration||10)*1000;sec._cap='';
    sec.appendChild(hub('mid','drop'));
    var hd=el('div','wx-head');hd.appendChild(el('h2',null,'Hava Durumu'));if(w.name){hd.appendChild(el('p','sub',w.name));}sec.appendChild(hd);
    var main=el('div','wx-main'),days=el('div','wx-days');sec.appendChild(main);sec.appendChild(days);
    sec.appendChild(el('div','wx-src','Veri: Open-Meteo.com'));
    sec._render=function(){
      main.innerHTML='';days.innerHTML='';
      if(!wxData){main.appendChild(el('div','wx-desc','Hava durumu bilgisi alınıyor…'));sec._cap='';return;}
      var cur=wxData.cur,inf=wxInfo(cur.weather_code),d=wxData.daily||{};
      var big=el('div','wx-big');big.innerHTML=wxIcon(cur.weather_code,cur.is_day);main.appendChild(big);
      main.appendChild(el('div','wx-temp',Math.round(cur.temperature_2m)+'°'));
      var col=el('div','wx-col');col.appendChild(el('div','wx-desc',inf[0]));
      col.appendChild(el('div','wx-meta','Hissedilen '+Math.round(cur.apparent_temperature)+'° · Nem %'+Math.round(cur.relative_humidity_2m)));
      col.appendChild(el('div','wx-meta','Rüzgâr '+Math.round(cur.wind_speed_10m)+' km/sa'));main.appendChild(col);
      (d.time||[]).slice(0,4).forEach(function(t,k){
        var p=String(t).split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]),card=el('div','wx-day');
        card.appendChild(el('b',null,k===0?'Bugün':WX_DAYS[dt.getDay()]));
        var ic=el('div','wx-ic');ic.innerHTML=wxIcon(d.weather_code&&d.weather_code[k],1);card.appendChild(ic);
        if(d.temperature_2m_max&&d.temperature_2m_min){card.appendChild(el('span',null,Math.round(d.temperature_2m_max[k])+'° / '+Math.round(d.temperature_2m_min[k])+'°'));}
        var pp=d.precipitation_probability_max&&d.precipitation_probability_max[k];
        if(pp!=null){card.appendChild(el('small',null,'☂ %'+Math.round(pp)));}
        days.appendChild(card);
      });
      sec._cap=(w.name?w.name+': ':'')+Math.round(cur.temperature_2m)+'°, '+inf[0].toLocaleLowerCase('tr-TR')+'. '+wxTip(cur,inf);
    };
    return sec;
  }

  function build(c,opts){
    opts=opts||{};content=c; stage.innerHTML=''; scenes=[];builtDay=dayKey();lastOpts=opts;wxRebuild=false;ensureWeather(c,opts.forceWeather);
    var st=c.settings||{};
    document.getElementById('brand').textContent=st.brand||'';
    var lg=document.getElementById('logo');
    if(st.showLogo!==false && st.logo){document.getElementById('logoImg').src=st.logo;lg.style.display='';}else{lg.style.display='none';}
    cap.style.display=(st.showCaptions===false)?'none':'';
    var userScenes=[];
    (c.scenes||[]).filter(function(s){return s.enabled!==false;}).forEach(function(s){
      var sec=el('section','scene');sec._d=Math.max(2,+s.duration||7)*1000;sec._cap=s.caption||'';sec._ord=userScenes.length;
      if(s.type==='hero'){
        sec.appendChild(hub('big',s.anim));
        if(s.title){ if(s.cta){var c1=el('span','cta fade',s.title);sec.appendChild(c1);} else {sec.appendChild(el('h1','fade',s.title));} }
        if(s.subtitle){sec.appendChild(el('p','sub fade l2',s.subtitle));}
      } else {
        sec.appendChild(hub('mid',s.anim));
        if(s.title){sec.appendChild(el('h2','fade',s.title));}
        if(s.subtitle){sec.appendChild(el('p','sub fade l2',s.subtitle));}
        var box=el('div',s.type==='flow'?'pop flow':'pop tiles');
        (s.tiles||[]).forEach(function(t,ix){
          if(s.type==='flow' && ix>0){box.appendChild(el('span','arrow','➜'));}
          box.appendChild(tile(t));
        });
        sec.appendChild(box);
      }
      userScenes.push(sec);
    });
    var bdays=birthdayScenes(c,opts);
    var wxs=(opts.forceWeather||(!opts.force&&wxCfg(c).scene&&wxFresh()))?[weatherScene(c)]:[];
    (opts.forceWeather?wxs:opts.force?bdays:userScenes.slice(0,1).concat(bdays,wxs,userScenes.slice(1))).forEach(function(sec){stage.appendChild(sec);scenes.push(sec);});
    if(!scenes.length){var e=el('section','scene active');e._d=5000;e._cap='';e.appendChild(el('h2',null,'Gösterilecek sahne yok'));stage.appendChild(e);scenes.push(e);}
  }
  function show(n){
    if(pending){var p=pending;pending=null;build(p);flash();n=Math.min(n,scenes.length-1);}
    else if(content&&!isPreview&&dayKey()!==builtDay){build(content);n=Math.min(n,scenes.length-1);}
    else if(wxRebuild&&content){build(content,lastOpts);n=Math.min(n,scenes.length-1);}
    scenes.forEach(function(s){s.classList.remove('active');});
    i=((n%scenes.length)+scenes.length)%scenes.length;done=false;
    var s=scenes[i];if(s._render){s._render();}void s.offsetWidth;s.classList.add('active');
    cap.textContent=s._cap;elapsed=0;start=performance.now();
    player.classList.toggle('light',!!s._light);
    player.classList.toggle('wx-scene',!!s._wx);
  }
  function flash(){var s=document.getElementById('sync');s.classList.add('show');setTimeout(function(){s.classList.remove('show');},3000);}
  function tick(t){
    if(playing&&scenes.length){var d=scenes[i]._d,e=elapsed+(t-start);
      bar.style.width=Math.min(100,e/d*100)+'%';
      if(e>=d){
        var loop=!content||!content.settings||content.settings.loop!==false;
        if(i<scenes.length-1){show(i+1);} else if(loop){show(0);} else {playing=false;done=true;playBtn.textContent='▶ Oynat';}
      }}
    requestAnimationFrame(tick);
  }
  function toggle(){
    if(playing){elapsed+=performance.now()-start;playing=false;playBtn.textContent='▶ Oynat';}
    else{if(done){show(0);}start=performance.now();playing=true;playBtn.textContent='⏸ Duraklat';}
  }
  function full(){var p=document.documentElement;if(document.fullscreenElement){document.exitFullscreen();}else if(p.requestFullscreen){p.requestFullscreen();}}
  playBtn.addEventListener('click',toggle);
  document.getElementById('next').addEventListener('click',function(){show(i+1);});
  document.getElementById('prev').addEventListener('click',function(){show(i-1);});
  document.getElementById('restart').addEventListener('click',function(){show(0);playing=true;playBtn.textContent='⏸ Duraklat';});
  document.getElementById('full').addEventListener('click',full);
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault();toggle();}
    else if(e.key==='ArrowRight'){show(i+1);}else if(e.key==='ArrowLeft'){show(i-1);}
    else if(e.key==='f'||e.key==='F'){full();}
  });

  /* live preview from the admin panel */
  window.addEventListener('message',function(ev){
    var m=ev.data; if(!(m&&m.type==='hubbert-preview'&&m.content)){return;}
    pending=null;build(m.content,{force:m.forceBirthday||null,forceWeather:!!m.forceWeather});
    var at=0;
    if(!m.forceBirthday&&!m.forceWeather&&typeof m.index==='number'){for(var q=0;q<scenes.length;q++){if(scenes[q]._ord===m.index){at=q;break;}}}
    show(at);playing=true;
  });

  /* auto-refresh: TVs poll the server and apply changes at the next scene */
  /* content source: content.json (GitHub Pages / static hosting) first, then api/content (company server) */
  function getJSON(url){return fetch(url+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok){throw new Error(r.status);}return r.json();});}
  /* when only index.html is hosted (e.g. GitHub Pages), read the content embedded in the published page itself */
  function getSelf(){
    return fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok){throw new Error(r.status);}return r.text();}).then(function(t){
      var a='/*HUBBERT-CONTENT-START*/',b='/*HUBBERT-CONTENT-END*/',s=t.indexOf(a),e=t.indexOf(b);
      if(s<0||e<0){throw new Error('no content');}
      return JSON.parse(t.slice(s+a.length,e));
    });
  }
  function getContent(){return getJSON('content.json').catch(function(){return getJSON('api/content');}).catch(getSelf);}
  function poll(){
    if(isPreview||location.protocol==='file:'){return;}
    getContent().catch(function(){return null;}).then(function(c){
      if(c&&content&&c.version!==content.version){pending=c;}
    }).catch(function(){}).then(function(){
      var sec=(content&&content.settings&&+content.settings.refreshSeconds)||10;
      setTimeout(poll,Math.max(3,sec)*1000);
    });
  }
  function boot(c){build(c);show(0);requestAnimationFrame(tick);poll();}
  if(isPreview||location.protocol==='file:'){boot(DEFAULT);}
  else{getContent().then(boot).catch(function(){boot(DEFAULT);});}
})();
</script>
